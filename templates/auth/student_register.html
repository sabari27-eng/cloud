{% extends 'base.html' %}

{% block title %}Student Registration - College Assignment Portal{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 680px;">
    <div class="csm-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-logo-large mx-auto mb-2" style="background: linear-gradient(135deg, #059669, #10b981);">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold text-dark">Student Registration</h3>
            <p class="text-muted small">Create your student account to submit course assignments</p>
        </div>

        <form method="POST" action="{{ url_for('auth.student_register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" value="{{ name or '' }}" placeholder="e.g. John Doe" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Register Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="register_no" value="{{ register_no or '' }}" placeholder="e.g. 21CS005" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Student Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" value="{{ email or '' }}" placeholder="john@student.college.edu" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" name="phone" value="{{ phone or '' }}" placeholder="+91 9876543210">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Department <span class="text-danger">*</span></label>
                    <select class="form-select" name="department" required>
                        <option value="">Select Department</option>
                        <option value="Computer Science" {% if department == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                        <option value="Information Technology" {% if department == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                        <option value="Electronics & Comm" {% if department == 'Electronics & Comm' %}selected{% endif %}>Electronics & Comm</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Semester <span class="text-danger">*</span></label>
                    <select class="form-select" name="semester" required>
                        <option value="1" {% if semester == '1' %}selected{% endif %}>1</option>
                        <option value="2" {% if semester == '2' %}selected{% endif %}>2</option>
                        <option value="3" {% if semester == '3' %}selected{% endif %}>3</option>
                        <option value="4" {% if semester == '4' %}selected{% endif %}>4</option>
                        <option value="5" {% if semester == '5' or not semester %}selected{% endif %}>5</option>
                        <option value="6" {% if semester == '6' %}selected{% endif %}>6</option>
                        <option value="7" {% if semester == '7' %}selected{% endif %}>7</option>
                        <option value="8" {% if semester == '8' %}selected{% endif %}>8</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Section</label>
                    <select class="form-select" name="class_section">
                        <option value="A" {% if class_section == 'A' %}selected{% endif %}>A</option>
                        <option value="B" {% if class_section == 'B' %}selected{% endif %}>B</option>
                        <option value="C" {% if class_section == 'C' %}selected{% endif %}>C</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Create Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="regPassword" name="password" placeholder="At least 6 chars" required>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="regPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="regConfirmPassword" name="confirm_password" placeholder="Re-enter password" required>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="regConfirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-success btn-lg fw-bold">
                    <i class="bi bi-check-circle me-1"></i> Register Student Account
                </button>
            </div>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <span class="text-muted small">Already have an account? </span>
            <a href="{{ url_for('auth.student_login') }}" class="text-success fw-bold text-decoration-none">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
