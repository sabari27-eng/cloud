{% extends 'base.html' %}

{% block title %}Administrator Login - CSM{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo-large" style="background: linear-gradient(135deg, #0f172a, #334155);">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">System Administration</h3>
            <p class="text-muted small">Authorized College Administrators Only</p>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="adminEmail" class="form-label">Admin Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person-fill text-muted"></i></span>
                    <input type="email" class="form-control" id="adminEmail" name="email" value="{{ email or '' }}" placeholder="admin@college.edu" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="adminPassword" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                    <input type="password" class="form-control" id="adminPassword" name="password" placeholder="Admin password" required>
                    <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="adminPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-dark btn-lg fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In to Admin Panel
                </button>
            </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{{ url_for('auth.teacher_login') }}" class="text-secondary small text-decoration-none me-3">
                <i class="bi bi-person-workspace me-1"></i> Teacher Portal
            </a>
            <a href="{{ url_for('auth.student_login') }}" class="text-secondary small text-decoration-none">
                <i class="bi bi-mortarboard me-1"></i> Student Portal
            </a>
        </div>
    </div>
</div>
{% endblock %}
