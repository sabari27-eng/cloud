{% extends 'base.html' %}

{% block title %}Student Login - College Assignment Portal{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo-large" style="background: linear-gradient(135deg, #059669, #10b981);">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Student Portal</h3>
            <p class="text-muted small">Submit assignments and view grades</p>
        </div>

        <form method="POST" action="{{ url_for('auth.student_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="studentIdentifier" class="form-label">Email or Register Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control" id="studentIdentifier" name="email_or_reg" value="{{ email_or_reg or '' }}" placeholder="21CS001 or email@student.edu" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="studentPassword" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                    <input type="password" class="form-control" id="studentPassword" name="password" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="studentPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-success btn-lg fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In as Student
                </button>
            </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-2">New student? Don't have an account?</p>
            <a href="{{ url_for('auth.student_register') }}" class="btn btn-outline-success btn-sm fw-semibold">
                <i class="bi bi-person-plus me-1"></i> Register Student Account
            </a>
        </div>
    </div>
</div>
{% endblock %}
