{% extends 'base.html' %}

{% block title %}404 Page Not Found - CSM{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="csm-card p-5 mx-auto" style="max-width: 580px;">
        <div class="stat-icon amber mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-question-circle-fill"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">
            {{ description or 'The requested URL or resource could not be found on this server.' }}
        </p>
        <a href="{{ url_for('auth.home') }}" class="btn btn-csm-primary">
            <i class="bi bi-house-door-fill me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
